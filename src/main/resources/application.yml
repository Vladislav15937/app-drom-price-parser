server:
  port: 8081
  forward-headers-strategy: native
  tomcat:
    connection-timeout: 20000

spring:
  config:
    import: classpath:analysis-profiles.yml   # типы запчастей (профили анализа)
  application:
    name: price-aggregator
  main:
    allow-bean-definition-overriding: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mvc:
    async:
      request-timeout: -1

# Swagger/OpenAPI (должен быть на корневом уровне, НЕ внутри spring!)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    filter: true
  api-docs:
    path: /v3/api-docs
  packages-to-scan: ru.retail.service.controller
  show-actuator: false

apify:
  enabled: false
  api:
    token: apify_api_yUzydG8Qrpt5gkdTGO6WdHLVRtDR5a4j9qoD
    base-url: https://api.apify.com
  actor:
    drom-scraper-id: Lz2PWiyvRnFjoINKV

drom:
  headless: true
  # «Точный подсчёт» (галочка в UI): сколько страниц выдачи листать. Одна страница = 50 объявлений,
  # поэтому на плотных категориях обычный режим занижает счётчик (у рычага 40 против фактических 85).
  # Режим по умолчанию не меняется: без галочки читается одна страница, как и раньше.
  deep-max-pages: 5   # пул воркеров работает в headless (4 браузера без окон)
  # Пул прокси: каждый порт = свой мобильный IP = отдельный параллельный воркер (через запятую, без пробелов)
  # 14847 (Новосибирск #17, megafon) / 14850 (Москва, Видное, megafon) / 13017 (Санкт-Петербург #48, yota) — до 07-11-2026
  # PID 561034/561035/561033. Признак истечения: curl -x через порт не соединяется (http=000), get_my_proxy отдаёт []
  proxies: http://ad7zuR:vyrgeJ3YRYB8@mproxy.site:14847,http://fUp7Yf:Dyj6Ut5Ed6fU@mproxy.site:14850,http://TaE7FY:Ab5udZAK3RER@mproxy.site:13017
  proxy:
    url: http://ad7zuR:vyrgeJ3YRYB8@mproxy.site:14847   # одиночная дорожка (веб/одиночный анализ)

twocaptcha:
  enabled: false  # капча drom — свой чекбокс /verify (без sitekey), 2captcha тут не работает; решает tryClickDromCheckbox + ротация IP
  api-key: 682948916e47240f5ce9a73ec7c1f4a4 # Ключ с 2captcha.com

# Автодисконт (кнопка «Автодисконт» в вебе): скидка в пики спроса от БАЗОВОЙ цены с откатом
# в остальные дни. Базовые цены хранятся в state-file — благодаря им скидка не накручивается
# сама на себя при повторных запусках и возможен возврат к исходной цене.
# Критерии дефицита и порог возраста задаёт клиент при расчёте; применение — только по кнопке.
discount:
  thursday: 5
  friday: 10
  saturday: 10
  sunday: 5
  state-file: autodiscount-state.json

# Публичный доступ к веб-интерфейсу (туннель).
# ngrok-domain — постоянный домен из кабинета ngrok (бесплатный тариф даёт один статический,
# вида "имя.ngrok-free.app"). Задан → ngrok идёт первым и ссылка НЕ меняется при переподключении;
# пусто → случайные адреса cloudflared/serveo/localhost.run, как раньше.
# ngrok-authtoken — токен агента из кабинета ngrok. Задан → передаётся агенту флагом --authtoken,
# и ngrok работает на любой машине без предварительного `ngrok config add-authtoken`
# (нужно для Windows-дистрибутива: там профиля пользователя с ngrok.yml нет).
# Пусто → агент берёт токен из профиля пользователя, как раньше.
# ВНИМАНИЕ: токен лежит в репозитории. При публикации репозитория его нужно ротировать
# (кабинет ngrok → Your Authtoken → Rotate authtoken).
tunnel:
  ngrok-domain: "easiness-darn-flaxseed.ngrok-free.dev"   # постоянный dev-домен аккаунта ngrok (кабинет → Domains)
  ngrok-authtoken: "3EXmSm9eK92x13eTO3XRuOWOAvF_4tTnySFQATwq7J3Ew2KVT"

