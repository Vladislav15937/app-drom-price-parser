# Учётная система Bazon (внешнее API): источник каталога наших запчастей.
# auth-url — хост выдачи/рефреша токенов; api-url — методы (external-api v1.0). Токен: логин/пароль external-app.
bazon:
  auth-url: https://a.baz-on.ru
  api-url: https://yardt.baz-on.ru/external-api/v1/    # v1.0: чтение каталога + запись цены (setProducts)
  login: c2226_external_app
  password: QM)3N2NnQQT!AHv
  storage-id: 1        # склад «Ткацкая» — по нему считаем свободный остаток (amount-reserved > 0)
  # Ссылка на карточку товара в Bazon: «Номер товара» в Excel-отчёте станет кликабельным.
  # {id} подставляется из номера товара. Пусто — номер остаётся обычным текстом.
  item-url-template: ""

feign:
  client:
    config:
      apify-actor-client:
        connectTimeout: 30000
        readTimeout: 300000
        loggerLevel: FULL
      apify-dataset-client:
        connectTimeout: 10000
        readTimeout: 60000
        loggerLevel: FULL

logging:
  level:
    ru.retail.service.client: DEBUG
    feign: DEBUG
    ru.retail.service.controller: DEBUG