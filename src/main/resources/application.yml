  api-key: 682948916e47240f5ce9a73ec7c1f4a4 # Ключ с 2captcha.com

# Публичный доступ к веб-интерфейсу (туннель).
# ngrok-domain — постоянный домен из кабинета ngrok (бесплатный тариф даёт один статический,
# вида "имя.ngrok-free.app"). Задан → ngrok идёт первым и ссылка НЕ меняется при переподключении;
# пусто → случайные адреса cloudflared/serveo/localhost.run, как раньше.
# Auth-токен ngrok в конфиге НЕ хранится: он прописывается один раз командой
#   ngrok config add-authtoken <токен>
# и лежит в профиле пользователя (~/Library/Application Support/ngrok/ngrok.yml), вне репозитория.
tunnel:
  ngrok-domain: ""

# Мобильные прокси mobileproxy.space (mproxy.site): account-токен для авто-дискавери change-IP ссылок.
# По нему пул на старте тянет proxy_change_ip_url по каждому порту → дорожки реактивно крутят IP при капче.
mobileproxy:
  api:
    url: https://mobileproxy.space/api.html
    token: 72034cf122d5303fd8d1af82e667b78b

# Профили анализа (типы запчастей) вынесены в analysis-profiles.yml — их 156, и они меняются
# отдельно от прокси/кредов. Подключение — spring.config.import выше. Список analysis.profiles
# держим ЦЕЛИКОМ там: YAML-списки из разных источников не сливаются, блок здесь перекрыл бы файл.

# Учётная система Bazon (внешнее API): источник каталога наших запчастей.
# auth-url — хост выдачи/рефреша токенов; api-url — методы (external-api v1.0). Токен: логин/пароль external-app.
bazon:
  auth-url: https://a.baz-on.ru
  api-url: https://yardt.baz-on.ru/external-api/v1/    # v1.0: чтение каталога + запись цены (setProducts)
  login: c2226_external_app
  password: QM)3N2NnQQT!AHv
  storage-id: 1        # склад «Ткацкая» — по нему считаем свободный остаток (amount-reserved > 0)

