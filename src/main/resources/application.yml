server:
  port: 8081
  forward-headers-strategy: native
  tomcat:
    connection-timeout: 20000

spring:
  config:
    import: classpath:analysis-profiles.yml   # типы запчастей (профили анализа)
  application:
    name: price-aggregator
  main:
    allow-bean-definition-overriding: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mvc:
    async:
      request-timeout: -1

# Swagger/OpenAPI (должен быть на корневом уровне, НЕ внутри spring!)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    filter: true
  api-docs:
    path: /v3/api-docs
  packages-to-scan: ru.retail.service.controller
  show-actuator: false

apify:
  enabled: false
  api:
    token: apify_api_yUzydG8Qrpt5gkdTGO6WdHLVRtDR5a4j9qoD
    base-url: https://api.apify.com
  actor:
    drom-scraper-id: Lz2PWiyvRnFjoINKV

drom:
  headless: true   # пул воркеров работает в headless (4 браузера без окон)
  # Пул прокси: каждый порт = свой мобильный IP = отдельный параллельный воркер (через запятую, без пробелов)
