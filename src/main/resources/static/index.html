<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Анализ наличия запчастей — Drom.ru</title>
<style>
  :root { --bg:#1e1e1e; --panel:#2b2b2b; --line:#3c3c3c; --dim:#a0a0a0; --blue:#60a5fa;
          --red:#ef4444; --yellow:#eab308; --purple:#a855f7; --green:#22c55e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:#e0e0e0; }
  #url-bar { padding:6px 16px; border-bottom:1px solid var(--line); font-size:12px; color:var(--dim); background:var(--panel); }
  #url-bar b { font-weight:600; }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tab { padding:12px 20px; cursor:pointer; color:var(--dim); }
  .tab.active { color:#fff; border-bottom:2px solid var(--blue); }
  .panel { padding:20px; display:none; }
  .panel.active { display:block; }
  label { display:inline-block; color:var(--dim); font-size:13px; margin-right:6px; }
  input[type=text], input[type=number] { background:#333; border:1px solid var(--line); color:#eee;
          border-radius:4px; padding:7px 9px; font-size:14px; }
  button { background:#3b82f6; color:#fff; border:none; border-radius:4px; padding:9px 18px;
          font-size:14px; cursor:pointer; }
  button:disabled { background:#444; color:#888; cursor:default; }
  .row { margin-bottom:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .status { color:var(--dim); font-size:13px; margin-left:8px; }
  table { border-collapse:collapse; width:100%; margin-top:14px; font-size:13px; }
  th,td { border:1px solid var(--line); padding:6px 8px; text-align:left; }
  th { background:#333; position:sticky; top:0; }
  a { color:var(--blue); }
  .badge { display:inline-block; padding:3px 10px; border-radius:12px; font-weight:600; font-size:13px; }
  .c-RED    { background:#7a1f1f; color:#ffd7d7; }
  .c-PURPLE { background:#4a2f6b; color:#e9d5ff; }
  .c-YELLOW { background:#6b5a12; color:#fff3b0; }
  .c-NONE   { background:#2f4a2f; color:#c9f0c9; }
  tr.RED    td { background:#3a1e1e; }
  tr.PURPLE td { background:#2e2440; }
  tr.YELLOW td { background:#3a3410; }
  .big { font-size:26px; font-weight:700; margin:8px 0; }
</style>
</head>
<body>
<div id="url-bar">
  <b>Локальный:</b> <span id="url-local">http://localhost:8081</span>
  &nbsp;|&nbsp; <b>Публичный:</b> <span id="url-pub">определяется…</span>
</div>

<div class="tabs">
  <div class="tab active" data-tab="single">Проверка по OEM</div>
  <div class="tab" data-tab="batch">Анализ по каталогу</div>
</div>

<!-- SINGLE -->
<div class="panel active" id="p-single">
  <div class="row">
    <label>OEM номер:</label>
    <input type="text" id="s-oem" style="width:220px" placeholder="4775068010">
  </div>
  <div class="row">
    <label>Компания на Drom:</label>
    <input type="text" id="s-company" value="YARD86" style="width:140px">
    <label style="margin-left:16px">Цена, ₽:</label>
    <input type="number" id="s-price" style="width:120px" placeholder="необязательно">
  </div>
  <div class="row">
    <button id="s-btn">Проверить наличие</button>
    <span class="status" id="s-status"></span>
  </div>
  <div id="s-result" style="display:none; margin-top:16px">
    <div class="big" id="s-title"></div>
    <div id="s-counts" style="font-size:15px; margin-bottom:8px"></div>
    <div id="s-note" style="color:var(--dim); font-style:italic; margin-bottom:12px"></div>
    <div id="s-link"></div>
  </div>
</div>

<!-- BATCH -->
<div class="panel" id="p-batch">
  <div class="row">
    <label>Файл каталога (CSV/XLSX):</label>
    <input type="file" id="b-file" accept=".csv,.xlsx">
  </div>
  <div class="row">
    <label>Компания на Drom:</label>
    <input type="text" id="b-company" value="YARD86" style="width:140px">
    <label style="margin-left:16px">Кол-во (0 = все):</label>
    <input type="number" id="b-limit" value="0" style="width:80px">
  </div>
  <div class="row">
    <button id="b-btn">Запустить анализ</button>
    <span class="status" id="b-status"></span>
  </div>
  <div style="color:var(--dim); font-size:12px; margin-top:6px">
    Цвета: <span class="badge c-RED">дефицит</span> Барнаул&lt;4 и Сибирь&lt;10 ·
    <span class="badge c-PURPLE">Сибирь&lt;10</span> · <span class="badge c-YELLOW">Барнаул&lt;4</span>
  </div>
  <div style="max-height:60vh; overflow:auto">
    <table>
      <thead><tr>
        <th>#</th><th>OEM</th><th>Запчасть</th><th>Барнаул</th><th>Сибирь</th>
        <th>Статус</th><th>Моё объявление</th>
      </tr></thead>
      <tbody id="b-tbody"></tbody>
    </table>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

// ── Server info ──
async function loadInfo() {
  try {
    const r = await fetch('/api/v1/info'); const j = await r.json();
    if (j.localUrl)  $('url-local').textContent = j.localUrl;
    $('url-pub').textContent = j.publicUrl || 'cloudflared не найден';
  } catch(e) {}
}
loadInfo(); setInterval(loadInfo, 15000);

// ── Tabs ──
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  $('p-' + t.dataset.tab).classList.add('active');
});

// ── SSE over fetch (POST) ──
async function sse(url, body, handlers) {
  const resp = await fetch(url, { method:'POST', body });
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream:true });
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      let ev = 'message', data = '';
      chunk.split('\n').forEach(line => {
        if (line.startsWith('event:')) ev = line.slice(6).trim();
        else if (line.startsWith('data:')) data += line.slice(5).trim();
      });
      if (handlers[ev]) handlers[ev](data);
    }
  }
}

const COLORS = { RED:'🔴 Дефицит', PURPLE:'🟣 Мало по Сибири', YELLOW:'🟡 Мало в Барнауле', NONE:'⚪ Конкуренция достаточная' };

function linkHtml(url) {
  return url ? `<a href="${url}" target="_blank">${url}</a>` : '<span style="color:var(--dim)">не найдено</span>';
}

// ── Single ──
$('s-btn').onclick = () => {
  const oem = $('s-oem').value.trim();
  if (!oem) { $('s-status').textContent = 'Введите OEM'; return; }
  const body = new URLSearchParams({ oem, catalogPrice: $('s-price').value || '0', company: $('s-company').value.trim() });
  $('s-btn').disabled = true; $('s-status').textContent = 'Анализ идёт…'; $('s-result').style.display = 'none';
  sse('/api/v1/catalog-item/stream', body, {
    result: d => {
      const r = JSON.parse(d);
      $('s-title').innerHTML = `<span class="badge c-${r.color}">${COLORS[r.color]}</span>`;
      $('s-counts').textContent = `Барнаул: ${r.barnaulCount} конкурентов   •   Сибирь: ` +
        (r.searchedSiberia ? r.siberiaCount + ' конкурентов' : 'не искали (в Барнауле ≥ 10)');
      $('s-note').textContent = r.status || '';
      $('s-link').innerHTML = 'Моё объявление: ' + linkHtml(r.myListingUrl);
      $('s-result').style.display = 'block';
      $('s-status').textContent = 'Готово'; $('s-btn').disabled = false;
    },
    error: d => { $('s-status').textContent = 'Ошибка: ' + d; $('s-btn').disabled = false; }
  }).catch(e => { $('s-status').textContent = 'Ошибка: ' + e; $('s-btn').disabled = false; });
};

// ── Batch ──
let bIndex = 0;
$('b-btn').onclick = () => {
  const f = $('b-file').files[0];
  if (!f) { $('b-status').textContent = 'Выберите CSV-файл'; return; }
  const fd = new FormData();
  fd.append('file', f);
  fd.append('company', $('b-company').value.trim());
  fd.append('limit', $('b-limit').value || '0');
  $('b-btn').disabled = true; $('b-tbody').innerHTML = ''; bIndex = 0;
  $('b-status').textContent = 'Запуск…';
  let total = 0, done = 0;
  sse('/api/v1/batch/stream', fd, {
    total: d => { total = +d; $('b-status').textContent = `0 / ${total}`; },
    row: d => {
      const p = JSON.parse(d);
      const r = p.result;
      const tr = document.createElement('tr');
      if (r) tr.className = r.color;
      const color = r ? r.color : 'NONE';
      tr.innerHTML = `<td>${++bIndex}</td><td>${p.oem||''}</td><td>${p.partName||''}</td>` +
        `<td>${r ? r.barnaulCount : '—'}</td>` +
        `<td>${r && r.searchedSiberia ? r.siberiaCount : '—'}</td>` +
        `<td>${p.status==='error' ? 'Ошибка' : `<span class="badge c-${color}">${(r&&r.status)||''}</span>`}</td>` +
        `<td>${r ? linkHtml(r.myListingUrl) : ''}</td>`;
      $('b-tbody').appendChild(tr);
      done++; $('b-status').textContent = `${done} / ${total}`;
    },
    error: d => { $('b-status').textContent = 'Ошибка: ' + d; $('b-btn').disabled = false; },
    done: d => { $('b-status').textContent = `Готово (${done} / ${total})`; $('b-btn').disabled = false; }
  }).catch(e => { $('b-status').textContent = 'Ошибка: ' + e; $('b-btn').disabled = false; });
};
</script>
</body>
</html>
