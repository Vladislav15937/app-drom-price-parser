# Профили анализа = типы запчастей (вынесены из application.yml, подключаются через spring.config.import).
# ВАЖНО: список analysis.profiles должен жить ЦЕЛИКОМ в этом файле — YAML-списки из разных источников
# не сливаются, и блок в application.yml перекрыл бы всё, что здесь.
#
# Поля профиля:
#   name                — подпись в UI (выпадающий список десктопа и веба); первый профиль — по умолчанию;
#   keyword             — фильтр каталога ИЗ ФАЙЛА: берём строки, где «Наименование»+«Запчасть» содержит это слово;
#   bazon-partname-ids  — фильтр каталога ИЗ BAZON: точный partname_id (метод getPartnames);
#   stop-words          — отсев ложных конкурентов на drom (смежная деталь с тем же OEM) и нецелевых строк каталога.
#
# Стоп-слово НЕ должно быть подстрокой своего keyword — иначе профиль отсеет сам себя
# (и в каталоге, и в подсчёте конкурентов → ложный «дефицит»). См. CLAUDE.md.
#
# Первые 5 профилей — рабочие, стоп-слова калиброваны на живых прогонах.
# Остальные добавлены 2026-09-01 из таблицы «ПЛАН» (Google Sheets), partname_id сверены со справочником Bazon.
# Стоп-слова у них заданы только там, где они были указаны в таблице; остальные требуют калибровки
# на ПЛОТНЫХ примерах перед боевым прогоном.

analysis:
  profiles:
    - name: "Суппорты"
      keyword: "суппорт"
      bazon-partname-ids: [1254]
      stop-words:
        - ремкомплект
        - ремонтный комплект
        - поршень
        - направляющ
        - пыльник
        - скоба
        - уплотнитель
        - манжет
        - прокладк
        - комплект направляющ
        - болт
        - пружин
        - шплинт
        - ступиц
        - диск
    - name: "Капоты"
      keyword: "капот"
      bazon-partname-ids: [305]
      stop-words:
        - замок          # замок капота
        - замка
        - петл           # петля капота
        - трос           # трос/тросик открывания капота
        - амортизатор    # амортизатор/упор капота
        - упор
        - накладк        # накладка/дефлектор на капот
        - молдинг
        - дефлектор
        - мухобойк
        - уплотнит        # уплотнитель капота
        - шумоизол        # шумо/звукоизоляция, утеплитель капота
        - звукоизол
        - изоляц
        - утеплит
        - обшивк
        - кронштейн       # кронштейн/крепление капота
        - крепл
        - эмблем          # эмблема/значок на капоте
        - значок
        - решет           # решётка (радиатора), идёт рядом на разборе
        - решёт
        - сетк
        - буфер
        - отбойник
        - клипс
        - пистон
        - ремкомплект
        - болт
        - гайка
        - шпилька
    - name: "Бампера"
      keyword: "бампер"
      bazon-partname-ids: [252]
      stop-words:
        - усилитель      # усилитель (балка) бампера — самый частый ложный по OEM
        - кронштейн      # кронштейн/крепление/направляющая бампера
        - крепл
        - направляющ
        - накладк        # накладка/молдинг/планка бампера
        - молдинг
        - планк
        - решет          # решётка бампера/радиатора
        - решёт
        - сетк
        - клык           # тюнинг/обвес: клык, губа, юбка, спойлер, диффузор
        - губа
        - юбк
        - спойлер
        - диффузор
        - сплиттер
        - обвес
        - абсорбер       # наполнитель/абсорбер бампера
        - наполнитель
        - пенопласт
        - парктроник     # датчики парковки (только специфичное слово, не «датчик»)
        - птф            # противотуманки в бампере
        - туманк
        - заглушк        # заглушка ПТФ/буксир. крюка
        - ресничк
        - эмблем
        - значок
        - буксировочн    # буксировочный крюк/проушина
        - проушин
        - кожух
        - клипс
        - пистон
        - фиксатор
        - ремкомплект
        - фара           # разборщики вешают OEM бампера на объявления фары/ПТФ
        - двигател       # …и на двигатель (чужая деталь с чужим OEM)
    - name: "Ступицы"
      keyword: "ступиц"
      bazon-partname-ids: [611]
      # ВНИМАНИЕ: «подшипник» НЕ в стоп-словах — ступица часто идёт «в сборе с подшипником» (иначе резали бы валидные).
      stop-words:
        - кулак          # поворотный кулак — отдельная деталь
        - поворотн
        - цапфа
        - пыльник        # пыльник ШРУСа/ступицы
        - сальник
        - гайка
        - шпилька
        - болт
        - колпак         # декоративный колпак колеса
        - суппорт        # ступица и суппорт рядом — на всякий
        - ремкомплект
    - name: "Диски тормозные"
      keyword: "диск тормозн"   # составное — чтобы фильтр каталога не цеплял колёсные диски/диски сцепления
      bazon-partname-ids: [869]
      stop-words:
        - комплект       # продаём ПО ОДНОМУ диску → пара/комплект = не наш конкурент
        - пара
        - суппорт        # обратный кейс: «диски + суппорты» комплектом
        - колодк         # тормозные колодки — своя деталь
        - ступиц
        - сцеплен        # диск сцепления
        - колёсн         # колёсный диск (литьё/штамповка)
        - колесн
        - литой
        - штампован
        - накладк
        - пыльник
        - кулак
        - цапфа
        - ремкомплект
        - гайка
        - болт
        - шпилька

